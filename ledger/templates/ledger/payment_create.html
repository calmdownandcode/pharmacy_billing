{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h1>New Payment Receipt</h1>
    <form method="POST" action="{% url 'payment_create' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="customer" class="form-label">Party / Customer</label>
            <select name="customer" id="customer" class="form-select" required>
                <option value="" selected disabled>Select Party</option>
                {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row">
            <div class="mb-3 col-md-6">
                <label for="payment_date" class="form-label">Date</label>
                <input type="date" name="payment_date" id="payment_date" class="form-control" required>
            </div>
            <div class="mb-3 col-md-6">
                <label for="amount" class="form-label">Amount (₹)</label>
                <input type="number" name="amount" id="amount" step="0.01" min="0.01" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="reference_no" class="form-label">Reference No (e.g. Chq / Txn ID)</label>
            <input type="text" name="reference_no" id="reference_no" class="form-control">
        </div>

        <div class="mb-3">
            <label for="remarks" class="form-label">Remarks</label>
            <textarea name="remarks" id="remarks" rows="3" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Save Payment</button>
    </form>
</div>
{% endblock %}
