<!DOCTYPE html>
<html>
<body>

<h1>New Payment</h1>

<form method="POST">

    {% csrf_token %}

    <label>Party</label>

    <select name="customer">

        {% for customer in customers %}

            <option value="{{ customer.id }}">
                {{ customer.name }}
            </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Date</label>

    <input
        type="date"
        name="payment_date"
    >

    <br><br>

    <label>Amount</label>

    <input
        type="number"
        step="0.01"
        name="amount"
    >

    <br><br>

    <label>Reference No</label>

    <input
        type="text"
        name="reference_no"
    >

    <br><br>

    <label>Remarks</label>

    <textarea
        name="remarks"
    ></textarea>

    <br><br>

    <button type="submit">
        Save Payment
    </button>

    

</form>

</body>
</html>
