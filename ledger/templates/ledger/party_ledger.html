<!DOCTYPE html>
<html>
<body>

<h1>
Ledger:
{{ customer.name }}
</h1>

<a href="{% url 'payment_create' %}">
    Add Payment
</a>

<h2>Invoices</h2>

<h2>
Outstanding:
{{ transactions|last.balance }}
</h2>

<table class="table table-striped table-bordered">

<tr>
    <th>Date</th>
    <th>Particulars</th>
    <th>Debit</th>
    <th>Credit</th>
    <th>Balance</th>
</tr>

{% for txn in transactions %}

<tr>

    <td>{{ txn.date }}</td>

    <td>{{ txn.particular }}</td>

    <td>{{ txn.debit }}</td>

    <td>{{ txn.credit }}</td>

    <td>{{ txn.balance }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
