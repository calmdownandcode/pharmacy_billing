<!DOCTYPE html>
<html>
<body>

<h1>New Purchase</h1>

<form method="POST">

    {% csrf_token %}

    <label>Supplier</label>

    <select name="supplier">

        {% for supplier in suppliers %}
            <option value="{{ supplier.id }}">
                {{ supplier.name }}
            </option>
        {% endfor %}

    </select>

    <br><br>

    <label>Invoice No</label>
    <input type="text" name="invoice_no">

    <br><br>

    <label>Invoice Date</label>
    <input type="date" name="invoice_date">

    <br><br>

    <button type="submit">
        Create Purchase
    </button>

</form>

</body>
</html>
