<!DOCTYPE html>
<html>
<body>

<h1>Low Stock Report</h1>

<table class="table table-striped table-bordered">

<tr>
    <th>Product</th>
    <th>Batch</th>
    <th>Stock</th>
    <th>PTR</th>
</tr>

{% for batch in batches %}

<tr>
    <td>{{ batch.product.name }}</td>
    <td>{{ batch.batch_no }}</td>
    <td>{{ batch.stock_qty }}</td>
    <td>{{ batch.ptr }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
