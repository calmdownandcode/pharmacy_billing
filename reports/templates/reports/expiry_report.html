<!DOCTYPE html>
<html>
<body>

<h1>Expiry Report</h1>

<table class="table table-striped table-bordered">

<tr>
    <th>Product</th>
    <th>Batch</th>
    <th>Expiry Date</th>
    <th>Stock</th>
</tr>

{% for batch in batches %}

<tr>

    <td>{{ batch.product.name }}</td>

    <td>{{ batch.batch_no }}</td>

    <td>{{ batch.expiry_date }}</td>

    <td>{{ batch.stock_qty }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
