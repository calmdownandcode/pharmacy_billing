<!DOCTYPE html>
<html>
<body>

<h1>Outstanding Report</h1>

<table class="table table-striped table-bordered">

<tr>
    <th>Party</th>
    <th>Outstanding</th>
</tr>

{% for row in data %}

<tr>

    <td>
        <a href="{% url 'party_ledger' row.customer.id %}">
            {{ row.customer.name }}
        </a>
    </td>

    <td>
        {{ row.outstanding }}
    </td>

</tr>

{% endfor %}

</table>

</body>
</html>
