{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Dashboard</h1>
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Today's Sales</h5>
                    <h3>₹{{ today_sales|default:"0.00" }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Today's Purchases</h5>
                    <h3>{{ today_purchases }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5>Low Stock Alerts</h5>
                    <h3>{{ low_stock_count }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <h5>Expiring Batches (90 Days)</h5>
                    <h3>{{ expiring_count }}</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-3">
        <a href="{% url 'purchase_create' %}" class="btn btn-outline-primary">New Purchase</a>
        <a href="{% url 'invoice_create' %}" class="btn btn-outline-success">New Sale</a>
        <a href="{% url 'payment_create' %}" class="btn btn-outline-dark">Add Payment</a>
    </div>
</div>

{% endblock %}
